<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF"/>
    </marker>
  </defs>

  <text x="350" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Two Deployment Modes, Same Interface</text>

  <!-- LIBRARY MODE -->
  <rect x="30" y="45" width="300" height="300" rx="8" fill="#111827" stroke="#D97706" stroke-width="2"/>
  <text x="180" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#FBBF24">LIBRARY MODE</text>
  <text x="180" y="82" text-anchor="middle" font-size="8" fill="#D97706">dev, single-process, small</text>

  <rect x="55" y="95" width="250" height="35" rx="5" fill="#374151"/>
  <text x="180" y="117" text-anchor="middle" font-size="9" fill="white">Civitas AgentProcess (one process)</text>

  <line x1="180" y1="130" x2="180" y2="150" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="55" y="152" width="250" height="35" rx="5" fill="#92400E"/>
  <text x="180" y="174" text-anchor="middle" font-size="9" fill="white">Fabrica managers — plain objects</text>

  <line x1="180" y1="187" x2="180" y2="207" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="55" y="209" width="250" height="35" rx="5" fill="#92400E"/>
  <text x="180" y="231" text-anchor="middle" font-size="9" fill="white">Retriever, SandboxPool — in-process</text>

  <line x1="180" y1="244" x2="180" y2="264" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="55" y="266" width="250" height="35" rx="5" fill="#1F2937" stroke="#4B5563"/>
  <text x="180" y="288" text-anchor="middle" font-size="9" fill="#D1D5DB">SQLite / local files — zero infra</text>

  <text x="180" y="322" text-anchor="middle" font-size="8" font-weight="700" fill="#FBBF24">function calls, no network hop</text>
  <text x="180" y="335" text-anchor="middle" font-size="8" fill="#D97706">Priya's "5 minutes, zero infra"</text>

  <!-- SERVICE MODE -->
  <rect x="370" y="45" width="300" height="300" rx="8" fill="#111827" stroke="#2563EB" stroke-width="2"/>
  <text x="520" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#60A5FA">SERVICE MODE</text>
  <text x="520" y="82" text-anchor="middle" font-size="8" fill="#2563EB">shared, multi-tenant, production</text>

  <rect x="395" y="95" width="250" height="35" rx="5" fill="#374151"/>
  <text x="520" y="117" text-anchor="middle" font-size="9" fill="white">Civitas AgentProcess (many, fleet-wide)</text>

  <line x1="520" y1="130" x2="520" y2="150" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="590" y="145" font-size="7" fill="#6B7280">message bus</text>

  <rect x="395" y="152" width="250" height="35" rx="5" fill="#1E3A5F"/>
  <text x="520" y="174" text-anchor="middle" font-size="9" fill="white">Fabrica managers — GenServers</text>

  <line x1="520" y1="187" x2="520" y2="207" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="395" y="209" width="250" height="35" rx="5" fill="#1E3A5F"/>
  <text x="520" y="231" text-anchor="middle" font-size="9" fill="white">Retriever, SandboxPool — supervised</text>

  <line x1="520" y1="244" x2="520" y2="264" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="395" y="266" width="250" height="35" rx="5" fill="#1F2937" stroke="#4B5563"/>
  <text x="520" y="288" text-anchor="middle" font-size="9" fill="#D1D5DB">Postgres / Redis — shared state</text>

  <text x="520" y="322" text-anchor="middle" font-size="8" font-weight="700" fill="#60A5FA">crash-restart under supervision</text>
  <text x="520" y="335" text-anchor="middle" font-size="8" fill="#2563EB">Marcus's "self-healing pool"</text>

  <!-- Footer -->
  <rect x="30" y="352" width="640" height="22" rx="4" fill="#111827"/>
  <text x="350" y="367" text-anchor="middle" font-size="8" fill="#A78BFA">Same Fabrica interface either way — mode is a config choice, not a code change.</text>
</svg>
