<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF"/>
    </marker>
  </defs>

  <text x="350" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Internal Object Model</text>
  <text x="350" y="40" text-anchor="middle" font-size="9" fill="#6B7280">what "from fabrica import Fabrica" actually gives you</text>

  <!-- Fabrica facade -->
  <rect x="270" y="55" width="160" height="46" rx="8" fill="#111827" stroke="#D97706" stroke-width="2.5"/>
  <text x="350" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#FBBF24">Fabrica</text>
  <text x="350" y="91" text-anchor="middle" font-size="7" fill="#D97706">top-level facade, one per deployment</text>

  <!-- Managers row -->
  <line x1="310" y1="101" x2="130" y2="130" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="335" y1="101" x2="290" y2="130" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="365" y1="101" x2="440" y2="130" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="390" y1="101" x2="590" y2="130" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="55" y="132" width="150" height="46" rx="6" fill="#92400E"/>
  <text x="130" y="151" text-anchor="middle" font-size="10" font-weight="700" fill="white">ToolManager</text>
  <text x="130" y="165" text-anchor="middle" font-size="7" fill="#FDE68A">registers ToolNamespace</text>

  <rect x="215" y="132" width="150" height="46" rx="6" fill="#92400E"/>
  <text x="290" y="151" text-anchor="middle" font-size="10" font-weight="700" fill="white">SkillManager</text>
  <text x="290" y="165" text-anchor="middle" font-size="7" fill="#FDE68A">loads SKILL.md packages</text>

  <rect x="375" y="132" width="130" height="46" rx="6" fill="#92400E"/>
  <text x="440" y="151" text-anchor="middle" font-size="10" font-weight="700" fill="white">MemoryManager</text>
  <text x="440" y="165" text-anchor="middle" font-size="7" fill="#FDE68A">wraps adapters</text>

  <rect x="515" y="132" width="150" height="46" rx="6" fill="#92400E"/>
  <text x="590" y="151" text-anchor="middle" font-size="10" font-weight="700" fill="white">PromptManager</text>
  <text x="590" y="165" text-anchor="middle" font-size="7" fill="#FDE68A">versioned prompts</text>

  <!-- ToolManager and SkillManager both depend on Retriever -->
  <line x1="130" y1="178" x2="270" y2="230" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="290" y1="178" x2="330" y2="230" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ToolManager and SkillManager both depend on SandboxPool -->
  <line x1="150" y1="178" x2="480" y2="230" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="310" y1="178" x2="500" y2="230" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Shared engines row -->
  <rect x="230" y="232" width="180" height="60" rx="8" fill="#111827" stroke="#7C3AED" stroke-width="2"/>
  <text x="320" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#A78BFA">Retriever</text>
  <text x="320" y="271" text-anchor="middle" font-size="7" fill="#DDD6FE">shared engine, one instance</text>
  <text x="320" y="283" text-anchor="middle" font-size="7" fill="#DDD6FE">injected into Tool + Skill managers</text>

  <rect x="440" y="232" width="200" height="60" rx="8" fill="#111827" stroke="#7C3AED" stroke-width="2"/>
  <text x="540" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#A78BFA">SandboxPool</text>
  <text x="540" y="271" text-anchor="middle" font-size="7" fill="#DDD6FE">platform-dispatch lives here</text>
  <text x="540" y="283" text-anchor="middle" font-size="7" fill="#DDD6FE">shared, one instance</text>

  <!-- Bridges row -->
  <line x1="320" y1="292" x2="250" y2="330" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <line x1="540" y1="292" x2="510" y2="330" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <text x="350" y="318" text-anchor="middle" font-size="7" fill="#9CA3AF">every action checks in before running</text>

  <rect x="55" y="330" width="270" height="60" rx="8" fill="#111827" stroke="#2563EB" stroke-width="2"/>
  <text x="190" y="352" text-anchor="middle" font-size="10" font-weight="700" fill="#60A5FA">CivitasBridge</text>
  <text x="190" y="367" text-anchor="middle" font-size="7" fill="#BFDBFE">wraps managers as GenServers</text>
  <text x="190" y="379" text-anchor="middle" font-size="7" fill="#BFDBFE">(service mode) or plain objects (library mode)</text>

  <rect x="375" y="330" width="270" height="60" rx="8" fill="#111827" stroke="#7C3AED" stroke-width="2"/>
  <text x="510" y="352" text-anchor="middle" font-size="10" font-weight="700" fill="#A78BFA">PresidiumClient</text>
  <text x="510" y="367" text-anchor="middle" font-size="7" fill="#DDD6FE">grant/policy check before every action</text>
  <text x="510" y="379" text-anchor="middle" font-size="7" fill="#DDD6FE">usage-event emission after every action</text>
</svg>
