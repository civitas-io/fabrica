<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF"/>
    </marker>
  </defs>

  <text x="350" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Internal Flow: What Happens Inside Fabrica for One Code-Mode Call</text>
  <text x="350" y="37" text-anchor="middle" font-size="8" fill="#6B7280">one level below the external "one request" diagram in architecture.md</text>

  <!-- Participants -->
  <rect x="10" y="50" width="90" height="36" rx="6" fill="#374151"/>
  <text x="55" y="72" text-anchor="middle" font-size="9" font-weight="600" fill="white">Agent</text>

  <rect x="135" y="50" width="110" height="36" rx="6" fill="#92400E"/>
  <text x="190" y="72" text-anchor="middle" font-size="9" font-weight="600" fill="white">ToolManager</text>

  <rect x="280" y="50" width="120" height="36" rx="6" fill="#111827" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="340" y="72" text-anchor="middle" font-size="9" font-weight="600" fill="#A78BFA">PresidiumClient</text>

  <rect x="435" y="50" width="110" height="36" rx="6" fill="#111827" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="490" y="72" text-anchor="middle" font-size="9" font-weight="600" fill="#A78BFA">SandboxPool</text>

  <rect x="580" y="50" width="110" height="36" rx="6" fill="#111827" stroke="#D97706" stroke-width="1.5"/>
  <text x="635" y="72" text-anchor="middle" font-size="9" font-weight="600" fill="#FBBF24">Sandbox</text>

  <!-- lifelines -->
  <line x1="55" y1="86" x2="55" y2="440" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="190" y1="86" x2="190" y2="440" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="340" y1="86" x2="340" y2="440" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="490" y1="86" x2="490" y2="440" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="635" y1="86" x2="635" y2="440" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- step numbers -->
  <text x="0" y="106" font-size="8" font-weight="700" fill="#6B7280">1</text>
  <text x="0" y="140" font-size="8" font-weight="700" fill="#6B7280">2</text>
  <text x="0" y="174" font-size="8" font-weight="700" fill="#6B7280">3</text>
  <text x="0" y="205" font-size="8" font-weight="700" fill="#6B7280">4</text>
  <text x="0" y="238" font-size="8" font-weight="700" fill="#6B7280">5</text>
  <text x="0" y="272" font-size="8" font-weight="700" fill="#6B7280">6</text>
  <text x="0" y="306" font-size="8" font-weight="700" fill="#6B7280">7</text>
  <text x="0" y="340" font-size="8" font-weight="700" fill="#6B7280">8</text>
  <text x="0" y="374" font-size="8" font-weight="700" fill="#6B7280">9</text>
  <text x="0" y="408" font-size="8" font-weight="700" fill="#6B7280">10</text>

  <!-- 1: Agent -> ToolManager: stubs() -->
  <line x1="55" y1="101" x2="182" y2="101" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="122" y="96" text-anchor="middle" font-size="7.5" fill="#374151">stubs() — discovery</text>

  <!-- 2: (external LLM call, note) -->
  <rect x="15" y="118" width="80" height="22" rx="4" fill="#FEF3C7"/>
  <text x="55" y="132" text-anchor="middle" font-size="7" font-weight="600" fill="#92400E">Agent's LLM</text>
  <text x="55" y="140" text-anchor="middle" font-size="6" fill="#92400E">writes code</text>

  <!-- 3: Agent -> ToolManager: run_code -->
  <line x1="55" y1="169" x2="182" y2="169" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="122" y="164" text-anchor="middle" font-size="7.5" fill="#374151">run_code(code)</text>

  <!-- 4: ToolManager -> PresidiumClient: check_grant -->
  <line x1="190" y1="200" x2="332" y2="200" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="260" y="195" text-anchor="middle" font-size="7.5" fill="#374151">check_grant(agent, "code_mode")</text>

  <!-- 5: PresidiumClient -> ToolManager: ALLOW -->
  <line x1="340" y1="233" x2="198" y2="233" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <text x="260" y="228" text-anchor="middle" font-size="7.5" fill="#374151">ALLOW</text>

  <!-- 6: ToolManager -> SandboxPool: acquire -->
  <line x1="190" y1="267" x2="482" y2="267" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="335" y="262" text-anchor="middle" font-size="7.5" fill="#374151">acquire(tier) — platform-appropriate</text>

  <!-- 7: SandboxPool -> ToolManager: handle -->
  <line x1="490" y1="301" x2="198" y2="301" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <text x="335" y="296" text-anchor="middle" font-size="7.5" fill="#374151">handle (from warm pool if available)</text>

  <!-- 8: ToolManager -> Sandbox: run -->
  <line x1="190" y1="335" x2="627" y2="335" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="410" y="330" text-anchor="middle" font-size="7.5" fill="#374151">run(code, bound namespace)</text>

  <!-- 9: Sandbox -> ToolManager: callback for real tool calls -->
  <line x1="635" y1="369" x2="198" y2="369" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="410" y="364" text-anchor="middle" font-size="7.5" font-weight="600" fill="#92400E">callback: namespace.call(tool, params) — repeats per call, stays in-sandbox</text>

  <!-- 10: ToolManager -> Sandbox: tool result, then Sandbox -> ToolManager: final result -->
  <line x1="190" y1="403" x2="627" y2="403" stroke="#D97706" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <text x="410" y="398" text-anchor="middle" font-size="7.5" fill="#92400E">real tool result — code keeps running</text>

  <!-- Final result + usage event -->
  <line x1="635" y1="425" x2="198" y2="425" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <text x="410" y="420" text-anchor="middle" font-size="7.5" fill="#374151">final RunResult, sandbox released back to pool</text>

  <!-- callback-loop note intentionally omitted here: same point already made
       by the footer bar and by code-mode-sequence.svg; avoided crowding this
       already-dense diagram -->

  <!-- Footer -->
  <rect x="10" y="440" width="680" height="18" rx="4" fill="#111827"/>
  <text x="350" y="453" text-anchor="middle" font-size="7.5" fill="#FBBF24">ToolManager also emits a usage event to PresidiumClient here — omitted above for space, shown in the full request-lifecycle diagram.</text>
</svg>
