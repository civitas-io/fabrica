<svg viewBox="0 0 700 265" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Memory — Wrap, With a Working Default Shipped</text>

  <!-- App -->
  <rect x="20" y="55" width="110" height="50" rx="6" fill="#374151"/>
  <text x="75" y="77" text-anchor="middle" font-size="10" font-weight="600" fill="white">Agent code</text>
  <text x="75" y="92" text-anchor="middle" font-size="7" fill="#D1D5DB">write/search/get/forget</text>

  <line x1="130" y1="80" x2="248" y2="80" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="190" y="67" text-anchor="middle" font-size="7" fill="#6B7280">Scope: user, session,</text>
  <text x="190" y="75" text-anchor="middle" font-size="7" fill="#6B7280">agent, team</text>

  <!-- MemoryStore protocol -->
  <rect x="250" y="40" width="180" height="80" rx="10" fill="#111827" stroke="#D97706" stroke-width="2.5"/>
  <text x="340" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#FBBF24">MemoryStore</text>
  <text x="340" y="89" text-anchor="middle" font-size="9" fill="#FDE68A">protocol</text>
  <text x="340" y="105" text-anchor="middle" font-size="7" fill="#D97706">one interface, many backends</text>

  <!-- Backends -->
  <line x1="300" y1="120" x2="150" y2="165" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="340" y1="120" x2="340" y2="165" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="390" y1="120" x2="570" y2="165" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="45" y="167" width="210" height="60" rx="6" fill="#1E3A5F"/>
  <text x="150" y="188" text-anchor="middle" font-size="9" font-weight="700" fill="white">Default</text>
  <text x="150" y="203" text-anchor="middle" font-size="8" fill="#BFDBFE">in-process SQLite / vector</text>
  <text x="150" y="216" text-anchor="middle" font-size="7" fill="#93C5FD">zero infra</text>

  <rect x="270" y="167" width="220" height="60" rx="6" fill="#92400E"/>
  <text x="380" y="185" text-anchor="middle" font-size="9" font-weight="700" fill="white">fabrica-contrib[mem0]</text>
  <text x="380" y="200" text-anchor="middle" font-size="7" fill="#FDE68A">validated by spike — pinned local</text>
  <text x="380" y="212" text-anchor="middle" font-size="7" fill="#FDE68A">config shipped, not Mem0's raw defaults</text>

  <rect x="505" y="167" width="180" height="60" rx="6" fill="#374151"/>
  <text x="595" y="185" text-anchor="middle" font-size="9" font-weight="700" fill="white">Zep / Letta / Cognee</text>
  <text x="595" y="200" text-anchor="middle" font-size="7" fill="#D1D5DB">LangMem</text>
  <text x="595" y="213" text-anchor="middle" font-size="7" fill="#9CA3AF">designed, not yet spiked</text>

  <!-- footnote -->
  <rect x="45" y="239" width="610" height="20" rx="4" fill="#FEF3C7"/>
  <text x="350" y="252" text-anchor="middle" font-size="8" font-weight="600" fill="#92400E">Spike found Mem0's own defaults require an OpenAI API key just to instantiate — the adapter absorbs that friction, the user never sees it.</text>
</svg>
