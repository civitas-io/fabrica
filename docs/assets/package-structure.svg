<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Package Structure</text>

  <!-- fabrica core -->
  <rect x="40" y="50" width="280" height="150" rx="8" fill="#111827" stroke="#D97706" stroke-width="2.5"/>
  <text x="180" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#FBBF24">pip install fabrica</text>

  <rect x="58" y="86" width="244" height="60" rx="5" fill="#92400E"/>
  <text x="180" y="103" text-anchor="middle" font-size="9" font-weight="700" fill="white">Protocols</text>
  <text x="180" y="118" text-anchor="middle" font-size="7" fill="#FDE68A">ToolNamespace, Sandbox, SkillStore,</text>
  <text x="180" y="130" text-anchor="middle" font-size="7" fill="#FDE68A">MemoryStore, PromptStore, Retriever</text>

  <rect x="58" y="153" width="244" height="40" rx="5" fill="#92400E"/>
  <text x="180" y="169" text-anchor="middle" font-size="9" font-weight="700" fill="white">Defaults</text>
  <text x="180" y="183" text-anchor="middle" font-size="7" fill="#FDE68A">KeywordBackend (Rust+PyO3), subprocess</text>

  <!-- arrow -->
  <line x1="320" y1="125" x2="378" y2="125" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="350" y="115" text-anchor="middle" font-size="7" fill="#6B7280">same interface,</text>
  <text x="350" y="145" text-anchor="middle" font-size="7" fill="#6B7280">swap the backend</text>

  <!-- fabrica-contrib -->
  <rect x="380" y="50" width="280" height="150" rx="8" fill="#111827" stroke="#6B7280" stroke-width="2"/>
  <text x="520" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#D1D5DB">fabrica-contrib[extra]</text>
  <text x="520" y="88" text-anchor="middle" font-size="8" fill="#9CA3AF">opt-in</text>

  <rect x="398" y="96" width="244" height="30" rx="5" fill="#1E3A5F"/>
  <text x="520" y="115" text-anchor="middle" font-size="8" fill="white">[firecracker] [srt] [libkrun] [gvisor] [kata]</text>

  <rect x="398" y="132" width="244" height="30" rx="5" fill="#4C1D95"/>
  <text x="520" y="151" text-anchor="middle" font-size="8" fill="white">[prx] [llamaindex] [langchain]</text>

  <rect x="398" y="168" width="244" height="26" rx="5" fill="#374151"/>
  <text x="520" y="185" text-anchor="middle" font-size="8" fill="white">[mem0] [zep] [letta] [cognee]</text>

  <!-- footer -->
  <rect x="60" y="220" width="580" height="40" rx="6" fill="#111827"/>
  <text x="350" y="236" text-anchor="middle" font-size="9" font-weight="700" fill="#FBBF24">Engineering principle: where Fabrica builds compute internals, Rust + Python binding —</text>
  <text x="350" y="250" text-anchor="middle" font-size="8" fill="#D1D5DB">matching prx's own shape. Wrapped libraries (Mem0, LlamaIndex, prx) are unaffected.</text>
</svg>
