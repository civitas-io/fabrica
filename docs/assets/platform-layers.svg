<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF"/>
    </marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Where Fabrica Sits</text>

  <!-- ═══ CONTEXT LAYER (Fabrica) — amber ═══ -->
  <rect x="50" y="45" width="600" height="95" rx="8" fill="#111827" stroke="#D97706" stroke-width="2"/>
  <text x="80" y="68" font-size="12" font-weight="700" fill="#FBBF24">CONTEXT</text>
  <text x="80" y="83" font-size="9" fill="#D97706">Fabrica</text>

  <rect x="170" y="58" width="80" height="35" rx="5" fill="#92400E"/>
  <text x="210" y="74" text-anchor="middle" font-size="8" font-weight="600" fill="white">Tools</text>
  <text x="210" y="87" text-anchor="middle" font-size="7" fill="#FDE68A">code-mode + find</text>

  <rect x="260" y="58" width="80" height="35" rx="5" fill="#92400E"/>
  <text x="300" y="74" text-anchor="middle" font-size="8" font-weight="600" fill="white">Skills</text>
  <text x="300" y="87" text-anchor="middle" font-size="7" fill="#FDE68A">SKILL.md + find</text>

  <rect x="350" y="58" width="80" height="35" rx="5" fill="#92400E"/>
  <text x="390" y="74" text-anchor="middle" font-size="8" font-weight="600" fill="white">Memory</text>
  <text x="390" y="87" text-anchor="middle" font-size="7" fill="#FDE68A">wraps Mem0/Zep</text>

  <rect x="440" y="58" width="75" height="35" rx="5" fill="#92400E"/>
  <text x="477" y="74" text-anchor="middle" font-size="8" font-weight="600" fill="white">Prompts</text>
  <text x="477" y="87" text-anchor="middle" font-size="7" fill="#FDE68A">PromptStore</text>

  <rect x="525" y="58" width="90" height="35" rx="5" fill="#92400E"/>
  <text x="570" y="74" text-anchor="middle" font-size="8" font-weight="600" fill="white">Sandbox</text>
  <text x="570" y="87" text-anchor="middle" font-size="7" fill="#FDE68A">tiered isolation</text>

  <rect x="170" y="103" width="445" height="24" rx="4" fill="#1F2937"/>
  <text x="392" y="119" text-anchor="middle" font-size="8" fill="#FBBF24">Decides what agents see and where their code runs</text>

  <!-- Arrow down: Context -> Control -->
  <line x1="350" y1="140" x2="350" y2="153" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="358" y="150" font-size="7" fill="#6B7280">grants / policy checks before every action</text>

  <!-- Arrow up: Control -> Context -->
  <line x1="300" y1="153" x2="300" y2="140" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="180" y="150" font-size="7" fill="#6B7280">ALLOW / DENY / REQUIRE_APPROVAL</text>

  <!-- ═══ CONTROL LAYER (Presidium) — purple ═══ -->
  <rect x="50" y="155" width="600" height="90" rx="8" fill="#111827" stroke="#7C3AED" stroke-width="2"/>
  <text x="80" y="178" font-size="12" font-weight="700" fill="#A78BFA">CONTROL</text>
  <text x="80" y="193" font-size="9" fill="#7C3AED">Presidium</text>

  <rect x="200" y="168" width="120" height="35" rx="5" fill="#4C1D95"/>
  <text x="260" y="184" text-anchor="middle" font-size="8" font-weight="600" fill="white">Policy / Grants</text>
  <text x="260" y="197" text-anchor="middle" font-size="7" fill="#DDD6FE">CEL, per-agent</text>

  <rect x="330" y="168" width="120" height="35" rx="5" fill="#4C1D95"/>
  <text x="390" y="184" text-anchor="middle" font-size="8" font-weight="600" fill="white">HITL / Approval</text>
  <text x="390" y="197" text-anchor="middle" font-size="7" fill="#DDD6FE">durable suspend</text>

  <rect x="460" y="168" width="130" height="35" rx="5" fill="#4C1D95"/>
  <text x="525" y="184" text-anchor="middle" font-size="8" font-weight="600" fill="white">Usage Ledger</text>
  <text x="525" y="197" text-anchor="middle" font-size="7" fill="#DDD6FE">budgets / metering</text>

  <text x="392" y="230" text-anchor="middle" font-size="8" fill="#A78BFA">Decides what agents are allowed to do</text>

  <!-- Arrow down: Control -> Runtime -->
  <line x1="350" y1="245" x2="350" y2="258" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="358" y="255" font-size="7" fill="#6B7280">runs as supervised GenServers</text>

  <!-- Arrow up: Runtime -> Control -->
  <line x1="300" y1="258" x2="300" y2="245" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="185" y="255" font-size="7" fill="#6B7280">restart on crash, transport, spans</text>

  <!-- ═══ RUNTIME LAYER (Civitas) — blue ═══ -->
  <rect x="50" y="260" width="600" height="90" rx="8" fill="#111827" stroke="#2563EB" stroke-width="2"/>
  <text x="80" y="283" font-size="12" font-weight="700" fill="#60A5FA">RUNTIME</text>
  <text x="80" y="298" font-size="9" fill="#2563EB">Civitas</text>

  <rect x="200" y="273" width="120" height="35" rx="5" fill="#1E3A5F"/>
  <text x="260" y="289" text-anchor="middle" font-size="8" font-weight="600" fill="white">Supervision Trees</text>
  <text x="260" y="302" text-anchor="middle" font-size="7" fill="#BFDBFE">ONE_FOR_ONE...</text>

  <rect x="330" y="273" width="120" height="35" rx="5" fill="#1E3A5F"/>
  <text x="390" y="289" text-anchor="middle" font-size="8" font-weight="600" fill="white">Message Bus</text>
  <text x="390" y="302" text-anchor="middle" font-size="7" fill="#BFDBFE">send / ask</text>

  <rect x="460" y="273" width="130" height="35" rx="5" fill="#1E3A5F"/>
  <text x="525" y="289" text-anchor="middle" font-size="8" font-weight="600" fill="white">OTEL Tracing</text>
  <text x="525" y="302" text-anchor="middle" font-size="7" fill="#BFDBFE">zero-code spans</text>

  <text x="392" y="335" text-anchor="middle" font-size="8" fill="#60A5FA">Keeps agents alive</text>

  <!-- Footer line -->
  <text x="350" y="378" text-anchor="middle" font-size="10" font-style="italic" fill="#374151">
    Civitas keeps agents alive. Presidium keeps them accountable. Fabrica decides what they see and how they act.
  </text>
</svg>
