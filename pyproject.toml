[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabrica-context"
version = "0.1.0"
description = "The context layer for Python agents -- part of the Civitas platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Jeryn Mathew Varghese" }]
keywords = ["llm", "agents", "context", "civitas", "tools", "sandbox", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "rank-bm25>=0.2.2",
    "pyzmq>=26.0",
    "pyyaml>=6.0",
    # civitas IS a real runtime dependency here, deliberately, unlike
    # everywhere else in fabrica (Presidium, model providers, etc. are all
    # duck-typed Protocols, never imported packages). CivitasBridge is the
    # one component architecture.md §1a licenses to integrate tightly with
    # Civitas -- and civitas.genserver.GenServer specifically is needed as
    # a real type, not a structural stand-in, because Civitas's dynamic-
    # spawn mechanism is nominally coupled to that concrete class (see
    # src/fabrica/civitas_bridge/runtime.py's inline note).
    "civitas>=0.11.0",
    "mcp>=2.0",
    # Already a transitive dependency of mcp (mcp.server.lowlevel.Server's
    # HTTP transport needs an ASGI host) -- listed explicitly here since
    # FabricaMCPServer imports and calls it directly (uvicorn.Config/
    # uvicorn.Server), not just relying on it existing on disk.
    "uvicorn>=0.31",
]

# Distribution name is "fabrica-context" (fabrica itself is taken on PyPI by
# an unrelated project -- see HANDOFF.md). The import name stays "fabrica",
# matching every signature in docs/contracts/*.md (`from fabrica import
# Fabrica`, not `from fabrica_context import ...`) -- a common, well-
# established pattern (pip install beautifulsoup4 -> import bs4;
# pip install pyyaml -> import yaml).
[tool.hatch.build.targets.wheel]
packages = ["src/fabrica"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.urls]
Repository = "https://github.com/civitas-io/fabrica"

# civitas>=0.11.0 IS resolvable from plain PyPI now -- confirmed directly
# against the real PyPI JSON API and via a clean `pip install` into a
# fresh, empty venv with zero workarounds (civitas 0.11.1 is published).
# The earlier reason this override existed (PyPI's own civitas releases
# lagging this project's floor, only 0.9.2.1 published at the time) is
# resolved and no longer applies to a plain `pip install fabrica-context`
# anywhere -- [tool.uv.sources] never appears in published wheel/sdist
# metadata, so end users are entirely unaffected by this section either
# way. It stays here for a real, DIFFERENT, machine-local reason: some
# dev machines (this one included) run a supply-chain policy
# (~/.config/uv/uv.toml's own `exclude-newer`) that rejects any package
# published after a rolling cutoff date -- which a sufficiently recent
# civitas release will eventually fall outside of again. The git-source
# pin keeps local `uv sync`/`uv lock` working on such machines regardless
# of that policy's cutoff; it is a local development convenience, not a
# statement about the published package's own PyPI availability.
[tool.uv.sources]
civitas = { git = "https://github.com/civitas-io/python-civitas.git", branch = "main" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# Real, found-by-CI reason, not a style preference: this project's own
# dev environment is often macOS, but every real deployment target for
# _firecracker_guest_shim.py specifically is Linux (it only ever runs
# inside a real Firecracker guest). typeshed's socket module stubs are
# platform-conditional -- socket.AF_VSOCK exists on the Linux stubs but
# not macOS's, so a `# type: ignore[attr-defined]` needed to satisfy
# local macOS mypy runs became a real "unused ignore" error on GitHub
# Actions' own Ubuntu runner (confirmed directly: the exact same code,
# same mypy version, differed in strictness verdict purely by host OS).
# Pinning `platform` (mypy's --platform equivalent) makes both
# environments evaluate consistently against the platform this code
# actually runs on, rather than whichever platform a given contributor's
# own laptop happens to be.
platform = "linux"

[[tool.mypy.overrides]]
# rank-bm25 ships no type stubs and no py.typed marker -- a known upstream
# gap, not something to work around by loosening strictness project-wide.
module = "rank_bm25"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "zmq.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true
